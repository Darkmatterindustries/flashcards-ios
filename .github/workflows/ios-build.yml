name: Build unsigned iOS test package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - name: Archive for iPhone
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Flashcards.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/Flashcards.xcarchive/Products/Applications/App.app build/package/Payload/
          cd build/package
          zip -qr ../Flashcards-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Flashcards-unsigned-needs-signing
          path: build/Flashcards-unsigned.ipa
          if-no-files-found: error
